  * { box-sizing: border-box; }

  .pill.skip { background: rgba(210,153,34,.15); color: var(--info); }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
  main { max-width: 1600px; margin: 0 auto; padding: 16px; }
  .tutorial-title { font-size: 20px; font-weight: 700; margin: 24px 0 8px; color: #fff; }

  .col { padding: 14px 18px; min-width: 0; }
  .col.left { border-right: 1px solid var(--border); }

  .row.has-fail { border-color: var(--fail); box-shadow: 0 0 0 1px var(--fail); }
  .row.has-fail .col.left { background: rgba(248,81,73,.07); border-right-color: var(--fail); }
  .row.has-fail .col.right { background: rgba(248,81,73,.12); }
  .col-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }

  .md blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .md img { width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px; }
  .exec { margin-bottom: 14px; }
  .exec:last-child { margin-bottom: 0; }
  .exec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; }
  .badge.pass { background: rgba(46,160,67,.15); color: var(--pass); }
  .badge.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .badge.info { background: rgba(210,153,34,.15); color: var(--info); }
  .kind { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .note { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  pre.cmd { background: var(--code-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin: 0 0 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  pre.output { background: #010409; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin: 0; overflow-x: auto; max-height: 360px; overflow-y: auto; color: #b9c1ca; }

  .heading-anchored:hover > a.anchor, a.anchor:focus { opacity: 1; }

  }

 to the host; the bundled modules loaded and `openmetrics` serving `/metrics`.\n\n**What you'll learn:**\n\n- How to build and run the image from the Dockerfile in this repo\n- How to publish the OpenMetrics port so the endpoint is reachable from outside the container\n- How to load the pre-installed modules into the running `logosctl` daemon\n- How to initialize `openmetrics` (`module load` + `call openmetrics start`) and scrape `/metrics`\n\n## Prerequisites\n\n- **Docker** \u2014 to build and run the image.\n- **curl** \u2014 to scrape the published endpoint from the host.\n- A network connection \u2014 the first build downloads the Nix builder layer and builds `logosctl`, which can take several minutes."}, {"execs": [], "md": "## Step 1: Build and run the image\n\nThe image is built straight from this repo. The Dockerfile is a\nmulti-stage build: a `nixos/nix` stage builds `logosctl` as an AppImage,\nand an `ubuntu` stage extracts it, then starts a throwaway daemon to\ninstall the pinned module versions with `logosctl install`. The default `CMD` is `logosctl daemon start`, with\n`LOGOSCTL_CONFIG_DIR=/var/lib/logos` selecting the session."}, {"execs": [{"cmd": "docker build -t logos:doctest \"https://github.com/logos-co/logos-docker.git#${LOGOS_DOCKER_REF:-master}\"\n", "exit_code": 0, "kind": "run", "note": "", "output": "#0 building with \"default\" instance using docker driver\n\n#1 [internal] load git source https://github.com/logos-co/logos-docker.git#a1fc9a190bd9befd4e98c27b7bce385760d3042d\n#1 0.013 Initialized empty Git repository in /var/lib/docker/overlay2/gwjn0bvg443ekuh2ez3o6gi1g/diff/\n#1 0.017 fatal: Not a valid object name a1fc9a190bd9befd4e98c27b7bce385760d3042d^{commit}\n#1 0.256 From https://github.com/logos-co/logos-docker\n#1 0.256  * branch            a1fc9a190bd9befd4e98c27b7bce385760d3042d -> FETCH_HEAD\n#1 DONE 0.6s\n\n#2 [auth] library/ubuntu:pull token for registry-1.docker.io\n#2 DONE 0.0s\n\n#3 [auth] nixos/nix:pull token for registry- enmetrics/openmetrics_plugin.so\",\"manifestVersion\":\"0.3.0\",\"name\":\"openmetrics\",\"type\":\"core\",\"version\":\"0.1.1\",\"view\":\"\"},{\"author\":\"Logos Core Team\",\"category\":\"management\",\"dependencies\":[],\"description\":\"Online package catalog and download service\",\"displayName\":\"Package Downloader\",\"hashes\":{\"root\":\"b7c03ded89d59ac53a0f150d87ebb5f164942569341289f7939bf28240aceebe\"},\"icon\":\"\",\"installDir\":\"/app/logosctl/usr/modules-pkg/package_downloader\",\"installType\":\"embedded\",\"license\":\"\",\"mainFilePath\":\"/app/logosctl/usr/modules-pkg/package_downloader/package_downloader_plugin.so\",\"manifestVersion\":\"0.5.0\",\"name\":\"package_downloader\",\"type\":\"core\",\"version\":\"1.0.0\",\"view\":\"\"},{\"author\":\"Logos Core Team\",\"category\":\"management\",\"dependencies\":[],\"description\":\"Plugin manager for the Logos system\",\"displayName\":\"Package Manager\",\"hashes\":{\"root\":\"a42c64ccba53d3a590a13c7ec74d4aadca9fd36a1152c14227913e42f70ec433\"},\"icon\":\"\",\"installDir\":\"/app/logosctl/usr/modules-pkg/package_manager\",\"installType\":\"embedded\",\"license\":\"\",\"mainFilePath\":\"/app/logosctl/usr/modules-pkg/package_manager/package_manager_plugin.so\",\"manifestVersion\":\"0.5.0\",\"name\":\"package_manager\",\"type\":\"core\",\"version\":\"1.0.0\",\"view\":\"\"},{\"author\":\"Logos Core Team\",\"category\":\"protocol\",\"dependencies\":[],\"description\":\"Storage module\",\"displayName\":\"Storage Module\",\"hashes\":{\"root\":\"877efd05f8409e71a168720af925644207d4c7907847136f314edd17f2b0d8d1\"},\"icon\":\"\",\"installDir\":\"/var/lib/logos/modules/storage_module\",\"installType\":\"user\",\"license\":\"\",\"mainFilePath\":\"/var/lib/logos/modules/storage_module/storage_module_plugin.so\",\"manifestVersion\":\"0.3.0\",\"name\":\"storage_module\",\"type\":\"core\",\"version\":\"2.1.3\",\"view\":\"\"}]\n#18 22.43 {\"message\":\"Daemon shutting down.\",\"status\":\"ok\"}\n#18 DONE 23.8s\n\n#19 exporting to image\n#19 exporting layers\n#19 exporting layers 2.0s done\n#19 writing image sha256:cf59f81143c3db259f300e6a223b3c0e0ca8c8f6271fbc821b19c084e86bd9e9 done\n#19 naming to docker.io/library/logos:doctest done\n#19 DONE 2.0s\n", "status": "pass"}, {"cmd": "docker image inspect logos:doctest --format '{{.Os}}/{{.Architecture}}'", "exit_code": 0, "kind": "run", "note": "", "output": "linux/amd64\n", "status": "pass"}], "md": "### 1.1 Build the image\n\nBuild from the repo URL (the same command the README documents). The\ndoc-test runner pins the ref to the commit under test via\n`$LOGOS_DOCKER_REF`.\n\n```bash\ndocker build -t logos https://github.com/logos-co/logos-docker.git\n```\n\nConfirm the image was built (it's a Linux image):\n\n```bash\ndocker image inspect logos --format '{{.Os}}/{{.Architecture}}'\n```"}, {"execs": [{"cmd": "docker run -d -p 9090:9090 --name logos-doctest logos:doctest", "exit_code": 0, "kind": "run", "note": "", "output": "db84bec956ec88381c731df0102a314072369f71df62bc581ce6589666bfd8fa\n", "status": "pass"}], "md": "### 1.2 Run the container with the OpenMetrics port published\n\nRun it detached (`-d`) and publish the port `openmetrics` will listen on\n(`-p 9090:9090`) so the endpoint is reachable from the host. The daemon\nstarts via the image's `CMD`.\n\n```bash\ndocker run -d -p 9090:9090 --name logos logos\n```"}, {"execs": [{"cmd": "sleep 5", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 5\n```"}, {"execs": [{"cmd": "docker exec logos-doctest logosctl status", "exit_code": 0, "kind": "run", "note": "", "output": "{\"daemon\":{\"pid\":1,\"status\":\"running\",\"version\":\"1.0.0\"},\"modules\":[{\"name\":\"storage_module\",\"status\":\"not_loaded\",\"version\":\"2.1.3\"},{\"name\":\"package_downloader\",\"status\":\"loaded\",\"uptime_seconds\":5,\"version\":\"1.0.0\"},{\"name\":\"openmetrics\",\"status\":\"not_loaded\",\"version\":\"0.1.1\"},{\"name\":\"modules_state\",\"status\":\"loaded\",\"uptime_seconds\":5,\"version\":\"0.1.0\"},{\"name\":\"package_manager\",\"status\":\"loaded\",\"uptime_seconds\":5,\"version\":\"1.0.0\"},{\"name\":\"delivery_module\",\"status\":\"not_loaded\",\"version\":\"0.2.1\"},{\"name\":\"capability_module\",\"status\":\"loaded\",\"uptime_seconds\":5,\"version\":\"1.0.0\"},{\"name\":\"blockchain_module\",\"status\":\"not_loaded\",\"version\":\"0.2.4\"}],\"modules_summary\":{\"crashed\":0,\"loaded\":4,\"not_loaded\":4}}\n", "status": "pass"}], "md": "### 1.3 Confirm the daemon is up\n\n```bash\ndocker exec logos logosctl status\n```"}, {"execs": [], "md": "## Step 2: Load the modules\n\nThe modules ship pre-installed under `/var/lib/logos/modules`. Loading a\nmodule makes it live in the running daemon (dependencies are resolved\nautomatically)."}, {"execs": [{"cmd": "docker exec logos-doctest logosctl package ls", "exit_code": 0, "kind": "run", "note": "", "output": "[{\"author\":\"Logos Blockchain Team\",\"category\":\"blockchain\",\"dependencies\":[],\"description\":\"Logos blockchain node for logos-core\",\"displayName\":\"Blockchain Module\",\"hashes\":{\"root\":\"2e57268c4ec1fdcf07e4b6bf1b33b5ac99705c071f879e6ca1c41b4e543cc674\"},\"icon\":\"\",\"installDir\":\"/var/lib/logos/modules/blockchain_module\",\"installType\":\"user\",\"license\":\"\",\"mainFilePath\":\"/var/lib/logos/modules/blockchain_module/blockchain_module_plugin.so\",\"manifestVersion\":\"0.3.0\",\"name\":\"blockchain_module\",\"type\":\"core\",\"version\":\"0.2.4\",\"view\":\"\"},{\"author\":\"Logos Core Team\",\"category\":\"protocol\",\"dependencies\":[],\"description\":\"Logos Delivery Module - High-level message-delivery API\",\"displayName\":\"\",\"hashes\":{\"root\":\"0bccd85b4702c01a2c227df8aa55b3f5159a9fe009d57ae8bb8b3a7c20dfcbbe\"},\"icon\":\"\",\"installDir\":\"/var/lib/logos/modules/delivery_module\",\"installType\":\"user\",\"license\":\"\",\"mainFilePath\":\"/var/lib/logos/modules/delivery_module/delivery_module_plugin.so\ ies\":[],\"description\":\"Storage module\",\"displayName\":\"Storage Module\",\"hashes\":{\"root\":\"877efd05f8409e71a168720af925644207d4c7907847136f314edd17f2b0d8d1\"},\"icon\":\"\",\"installDir\":\"/var/lib/logos/modules/storage_module\",\"installType\":\"user\",\"license\":\"\",\"mainFilePath\":\"/var/lib/logos/modules/storage_module/storage_module_plugin.so\",\"manifestVersion\":\"0.3.0\",\"name\":\"storage_module\",\"type\":\"core\",\"version\":\"2.1.3\",\"view\":\"\"}]\n", "status": "pass"}], "md": "### 2.1 List what's installed\n\n```bash\ndocker exec logos logosctl package ls\n```"}, {"execs": [{"cmd": "docker exec logos-doctest logosctl module load delivery_module\ndocker exec logos-doctest logosctl module load storage_module\ndocker exec logos-doctest logosctl module load blockchain_module\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"delivery_module\",\"status\":\"ok\",\"version\":\"0.2.1\"}\n{\"dependencies_loaded\":[],\"module\":\"storage_module\",\"status\":\"ok\",\"version\":\"2.1.3\"}\n{\"dependencies_loaded\":[],\"module\":\"blockchain_module\",\"status\":\"ok\",\"version\":\"0.2.4\"}\n", "status": "pass"}], "md": "### 2.2 Load the bundled modules\n\n```bash\ndocker exec logos logosctl module load delivery_module\ndocker exec logos logosctl module load storage_module\ndocker exec logos logosctl module load blockchain_module\n```"}, {"execs": [], "md": "## Step 3: Initialize OpenMetrics\n\nLoad the `openmetrics` module, then `start` its HTTP server with a config\nJSON: the port to listen on and the modules to scrape. The JSON is passed as\na single argument so it reaches the module intact."}, {"execs": [{"cmd": "docker exec logos-doctest logosctl module load openmetrics", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"openmetrics\",\"status\":\"ok\",\"version\":\"0.1.1\"}\n", "status": "pass"}], "md": "### 3.1 Load the openmetrics module\n\n```bash\ndocker exec logos logosctl module load openmetrics\n```"}, {"execs": [{"cmd": "docker exec logos-doctest logosctl call openmetrics start '{\"port\":9090,\"modules\":[\"delivery_module\",\"storage_module\",\"blockchain_module\"]}'\n", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"start\",\"module\":\"openmetrics\",\"result\":1,\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.2 Start the OpenMetrics server\n\nBind it to `9090` \u2014 the port we published \u2014 so the endpoint is reachable\nfrom the host. `start` returns `1` on success.\n\n```bash\ndocker exec logos logosctl call openmetrics start '{\"port\":9090,\"modules\":[\"delivery_module\",\"storage_module\",\"blockchain_module\"]}'\n```"}, {"execs": [{"cmd": "sleep 1", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 1\n```"}, {"execs": [{"cmd": "docker exec logos-doctest logosctl call openmetrics getInfo", "exit_code": 0, "kind": "run", "note": "", "output": "{\"method\":\"getInfo\",\"module\":\"openmetrics\",\"result\":\"{\\\"modules\\\":[{\\\"format\\\":\\\"data\\\",\\\"name\\\":\\\"delivery_module\\\"},{\\\"format\\\":\\\"data\\\",\\\"name\\\":\\\"storage_module\\\"},{\\\"format\\\":\\\"data\\\",\\\"name\\\":\\\"blockchain_module\\\"}],\\\"port\\\":9090,\\\"running\\\":true}\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 3.3 getInfo reports what it's serving\n\n`getInfo()` returns its status as a JSON string, so `logosctl` delivers\nit as an escaped string inside the `result` field.\n\n```bash\ndocker exec logos logosctl call openmetrics getInfo\n```"}, {"execs": [], "md": "## Step 4: Scrape /metrics from the host\n\nBecause the port is published, Prometheus \u2014 or a plain `curl` from the host\n\u2014 can scrape the endpoint without entering the container."}, {"execs": [{"cmd": "curl -s --max-time 15 http://localhost:9090/metrics", "exit_code": 0, "kind": "run", "note": "", "output": "# EOF\n", "status": "pass"}], "md": "### 4.1 Scrape /metrics\n\nThe document is valid OpenMetrics and ends with `# EOF`. There are no\nseries yet because none of the bundled modules implement\n`collectMetrics()` \u2014 once one does, its series appear here automatically.\n\n```bash\ncurl http://localhost:9090/metrics\n```"}, {"execs": [{"cmd": "curl -s --max-time 5 http://localhost:9090/health", "exit_code": 0, "kind": "run", "note": "", "output": "ok\n", "status": "pass"}], "md": "### 4.2 Check /health\n\n```bash\ncurl http://localhost:9090/health\n```"}, {"execs": [], "md": "## Step 5: Clean up\n\nStop and remove the container (this also stops the daemon and the\nOpenMetrics server inside it)."}, {"execs": [{"cmd": "docker rm -f logos-doctest", "exit_code": 0, "kind": "run", "note": "", "output": "logos-doctest\n", "status": "pass"}], "md": "### 5.1 Remove the container\n\n```bash\ndocker rm -f logos\n```"}, {"execs": [], "md": "## Recap\n\n| Step | Command | What it proves |\n| ---- | ------- | -------------- |\n| Build & run | `docker build` / `docker run -d -p 9090:9090` | the image builds and the daemon comes up with the metrics port published |\n| Load | `logosctl module load <name>` | the bundled modules load into the running daemon |\n| Initialize | `logosctl call openmetrics start '{\u2026}'` | `openmetrics` stands up its HTTP server on the published port |\n| Scrape | `curl http://localhost:9090/metrics` | the endpoint is reachable from outside the container and serves valid OpenMetrics |\n\nThe `openmetrics` endpoint is now reachable from the host on `:9090`. Point a\nPrometheus scrape at it, and as the bundled modules grow `collectMetrics()`\nimplementations their series will show up automatically, each labelled with\n`module=\"<name>\"`."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
